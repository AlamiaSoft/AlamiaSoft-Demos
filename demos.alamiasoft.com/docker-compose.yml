services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: alamia-demo-portal:latest
    container_name: alamia-demo-portal
    restart: unless-stopped
    ports:
      # Bind to localhost so cloudflared on host can route to http://localhost:8080
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - demo-portal-net

networks:
  demo-portal-net:
    driver: bridge
